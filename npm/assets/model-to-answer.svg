<text x="58" y="433" font-size="21" font-weight="650" fill="#14644b" class="mono">game_lost_by(game, white)</text>
<text x="58" y="477" font-size="29" font-weight="700" fill="#14644b" class="mono">TRUE_ONLY</text>
<text x="58" y="508" font-size="18" font-weight="600" fill="#14644b" class="mono">COMPUTED</text>
<text x="540" y="433" font-size="24" font-weight="650" fill="#315d84">Canonical document + proof</text>
<text x="540" y="475" font-size="20" font-weight="400" fill="#122d4c">Producer IDs · requests · hashes</text>
<text x="540" y="508" font-size="17" font-weight="400" fill="#53677d">Source links join the retained model anchors</text></svg>
